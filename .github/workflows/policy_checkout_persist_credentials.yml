name: Policy - Enforce actions/checkout persist-credentials false

on:
  workflow_call:

permissions:
  contents: read

jobs:
  enforce-checkout-persist-credentials:
    name: Enforce checkout persist-credentials false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate workflow files
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import sys
          from pathlib import Path

          import yaml

          files = sorted(glob.glob('.github/workflows/*.yml'))
          violations = []

          for wf in files:
              text = Path(wf).read_text(encoding='utf-8')
              try:
                  data = yaml.safe_load(text) or {}
              except Exception as exc:
                  violations.append((wf, 1, f'Unable to parse YAML: {exc}'))
                  continue

              jobs = data.get('jobs', {})
              if not isinstance(jobs, dict):
                  continue

              lines = text.splitlines()

              for job in jobs.values():
                  if not isinstance(job, dict):
                      continue
                  steps = job.get('steps', [])
                  if not isinstance(steps, list):
                      continue

                  for step in steps:
                      if not isinstance(step, dict):
                          continue
                      uses = str(step.get('uses', '')).strip()
                      if not uses.startswith('actions/checkout@'):
                          continue

                      with_block = step.get('with', {})
                      ok = isinstance(with_block, dict) and with_block.get('persist-credentials') is False

                      if ok:
                          continue

                      marker = 'uses: actions/checkout@'
                      line_no = 1
                      for idx, line in enumerate(lines, start=1):
                          if marker in line:
                              line_no = idx
                              break

                      violations.append(
                          (
                              wf,
                              line_no,
                              "actions/checkout must set with.persist-credentials: false",
                          )
                      )

          if violations:
              print('Policy violation(s) detected:')
              for wf, line_no, msg in violations:
                  print(f'  - {wf}:{line_no}: {msg}')
              print('\nRemediation:')
              print('  Add the following under each actions/checkout step:')
              print('    with:')
              print('      persist-credentials: false')
              sys.exit(1)

          print('All workflow files comply: actions/checkout uses persist-credentials: false')
          PY
