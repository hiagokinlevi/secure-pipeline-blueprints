name: PR Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  sast_semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (SARIF)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/ci
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  dependency_review:
    name: Dependency Review (SCA)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Dependency vulnerability review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  commit_signature_verification:
    name: Verify Commit Signatures
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Validate all PR commits are verified
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number, per_page: 100 }
            );

            const invalid = commits.filter(c => !c.commit?.verification?.verified);

            if (invalid.length > 0) {
              core.setFailed(
                `Found ${invalid.length} unverified commit(s):\n` +
                invalid.map(c => `- ${c.sha.substring(0, 7)} (${c.commit?.verification?.reason || 'unknown'})`).join('\n')
              );
              return;
            }

            core.info(`All ${commits.length} commit(s) are signature-verified.`);
