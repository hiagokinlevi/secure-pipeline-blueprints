# =============================================================================
# Reusable Secret Scanning Workflow — secure-pipeline-blueprints
# =============================================================================
# This is a reusable GitHub Actions workflow for secret scanning via Gitleaks.
# Other repositories can call this workflow instead of defining their own.
#
# How to use from another repository:
#
#   jobs:
#     security:
#       uses: hiagokinlevi/secure-pipeline-blueprints/.github/workflows/secret_scan.yml@main
#       secrets: inherit
#
# Or with explicit secrets:
#
#   jobs:
#     security:
#       uses: hiagokinlevi/secure-pipeline-blueprints/.github/workflows/secret_scan.yml@main
#       secrets:
#         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#
# Inputs:
#   - fetch_depth (optional): Number of commits to fetch. Default: 0 (full history).
#     Set to 1 for faster scans on large repos (loses historical scanning accuracy).
#   - config_path (optional): Path to a custom Gitleaks config. Defaults to built-in config.
#   - fail_on_leak (optional): Whether to fail the job on leak detection. Default: true.
#
# Outputs:
#   - scan_result: "pass" or "fail"
# =============================================================================

name: Reusable Secret Scan

on:
  workflow_call:
    inputs:
      fetch_depth:
        description: "Depth of git history to fetch. 0 = full history (recommended for accuracy)"
        type: number
        default: 0
        required: false

      config_path:
        description: "Path to a custom Gitleaks configuration file"
        type: string
        default: ""
        required: false

      fail_on_leak:
        description: "If true, fail the workflow when secrets are found. Set to false for audit-only mode."
        type: boolean
        default: true
        required: false

    outputs:
      scan_result:
        description: "Secret scan result: 'pass' if no secrets found, 'fail' if secrets detected"
        value: ${{ jobs.gitleaks.outputs.result }}

    secrets:
      GITHUB_TOKEN:
        description: "GitHub token required by Gitleaks action"
        required: true

# Minimum permissions for this reusable workflow
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set-result.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the fetch_depth input — 0 = full history for most accurate scanning
          # Note: shallow clones miss secrets committed and then deleted in old commits
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Run Gitleaks (with custom config)
        # This step runs if a custom config path was provided
        if: inputs.config_path != ''
        id: gitleaks-custom
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: ${{ !inputs.fail_on_leak }}  # In audit mode, do not fail the step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config=${{ inputs.config_path }}

      - name: Run Gitleaks (default config)
        # This step runs if no custom config path was provided
        if: inputs.config_path == ''
        id: gitleaks-default
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: ${{ !inputs.fail_on_leak }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set output result
        id: set-result
        # Determine the output value based on the step outcomes
        run: |
          # Check if either gitleaks step ran and what the result was
          CUSTOM_OUTCOME="${{ steps.gitleaks-custom.outcome }}"
          DEFAULT_OUTCOME="${{ steps.gitleaks-default.outcome }}"

          if [[ "$CUSTOM_OUTCOME" == "failure" || "$DEFAULT_OUTCOME" == "failure" ]]; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "::warning::Gitleaks detected potential secrets. Review findings above."
          else
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "Gitleaks scan completed: no secrets detected."
          fi

      - name: Fail job if secrets found and fail_on_leak is true
        # This step provides a clear failure message when fail_on_leak is enabled
        if: |
          inputs.fail_on_leak == true && (
            steps.gitleaks-custom.outcome == 'failure' ||
            steps.gitleaks-default.outcome == 'failure'
          )
        run: |
          echo "::error::Gitleaks detected secrets in the repository. Fix the findings before merging."
          echo "::error::To suppress a false positive, add a '# gitleaks:allow' comment on the line,"
          echo "::error::or add an allowlist entry to your gitleaks.toml config."
          exit 1
