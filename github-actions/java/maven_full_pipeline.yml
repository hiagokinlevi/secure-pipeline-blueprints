name: Java Maven Secure Full Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-surefire-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep:latest \
            semgrep scan --config=p/security-audit --json --output /src/semgrep-results.json /src

      - name: Enforce Semgrep gate (ERROR findings fail)
        run: |
          python - <<'PY'
          import json, sys
          p = 'semgrep-results.json'
          try:
            data = json.load(open(p, encoding='utf-8'))
          except FileNotFoundError:
            print('Semgrep report not found; failing.')
            sys.exit(2)
          results = data.get('results', [])
          error_count = sum(1 for r in results if str(r.get('extra', {}).get('severity', '')).upper() == 'ERROR')
          print(f'Semgrep ERROR findings: {error_count}')
          sys.exit(1 if error_count > 0 else 0)
          PY

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.json
          if-no-files-found: error

  gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/path" \
            zricethezav/gitleaks:latest \
            detect --source=/path --report-format=json --report-path=/path/gitleaks-report.json --redact

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  dependency_check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build dependency tree
        run: mvn -B -ntp -DskipTests package

      - name: Run OWASP Dependency-Check (fail on CVSS >= 7)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: '${{ github.repository }}'
          path: '.'
          format: 'HTML,JSON'
          out: 'dependency-check-report'
          args: >-
            --enableRetired
            --scan .
            --failOnCVSS 7

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: dependency-check-report/**
          if-no-files-found: ignore
