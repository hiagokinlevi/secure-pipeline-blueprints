[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-pipeline-blueprints"
version = "0.1.0"
description = "Security-first CI/CD blueprints, validators, and analyzers for defensive DevSecOps workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC BY 4.0" }
authors = [
  { name = "Hiago Kin Levi" }
]
keywords = ["security", "devsecops", "github-actions", "gitlab-ci", "blueprints"]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
validate-blueprint = "shared.validators.validate_blueprint:main"

[tool.setuptools]
py-modules = ["yaml"]

[tool.setuptools.packages.find]
include = ["shared", "shared.*"]
