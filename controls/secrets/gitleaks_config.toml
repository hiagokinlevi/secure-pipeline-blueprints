# =============================================================================
# Gitleaks Configuration — secure-pipeline-blueprints
# =============================================================================
# This configuration extends Gitleaks' built-in rules with additional patterns
# for secrets commonly found in enterprise and cloud-native environments.
#
# Usage:
#   gitleaks detect --config controls/secrets/gitleaks_config.toml --source .
#
# In GitHub Actions:
#   uses: gitleaks/gitleaks-action@v2
#   with:
#     args: --config=controls/secrets/gitleaks_config.toml
#
# Documentation:
#   https://github.com/gitleaks/gitleaks/tree/master/config
# =============================================================================

# Use Gitleaks' built-in rules as the base
[extend]
useDefault = true  # Inherit all default Gitleaks rules

# ---------------------------------------------------------------------------
# Custom Rules — Additional secret patterns
# ---------------------------------------------------------------------------

[[rules]]
id = "k1n-cloudflare-api-token"
description = "Cloudflare API Token"
# Cloudflare API tokens are 40-character base64url strings
regex = '''(?i)(cloudflare.{0,20})[=:\"'\s]+([A-Za-z0-9_-]{40})'''
tags = ["cloudflare", "api-token", "cloud"]
entropy = 3.5  # Require high entropy to reduce false positives
keywords = ["cloudflare"]

[[rules]]
id = "k1n-cloudflare-global-api-key"
description = "Cloudflare Global API Key (legacy)"
# Global API keys are 37-character hex strings
regex = '''(?i)(cloudflare.{0,20}global.{0,20}key.{0,20})[=:\"'\s]+([a-f0-9]{37})'''
tags = ["cloudflare", "api-key", "cloud"]
keywords = ["cloudflare"]

[[rules]]
id = "k1n-semgrep-app-token"
description = "Semgrep App Token"
regex = '''(?i)semgrep.{0,20}[=:\"'\s]+([a-zA-Z0-9]{40,60})'''
tags = ["semgrep", "ci-token"]
keywords = ["semgrep"]

[[rules]]
id = "k1n-jwt-token-in-source"
description = "JWT token hardcoded in source code"
# JWT tokens have the format: header.payload.signature
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["jwt", "auth-token"]
entropy = 3.0

[[rules]]
id = "k1n-terraform-cloud-token"
description = "Terraform Cloud API Token"
regex = '''(?i)(terraform.{0,20}token|tf_token).{0,20}[=:\"'\s]+([A-Za-z0-9\.]{47})'''
tags = ["terraform", "ci-token"]
keywords = ["terraform"]

[[rules]]
id = "k1n-generic-private-key-pem"
description = "Generic PEM private key block"
# Matches PEM private key headers
regex = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''
tags = ["private-key", "pem", "tls"]
# Note: this will match encrypted private keys too — they should not be in source

[[rules]]
id = "k1n-database-connection-string-postgres"
description = "PostgreSQL connection string with credentials"
regex = '''postgres(?:ql)?:\/\/[^:]+:[^@]+@[^\s"']+'''
tags = ["database", "postgres", "credentials"]
keywords = ["postgres", "postgresql"]

[[rules]]
id = "k1n-database-connection-string-mysql"
description = "MySQL connection string with credentials"
regex = '''mysql:\/\/[^:]+:[^@]+@[^\s"']+'''
tags = ["database", "mysql", "credentials"]
keywords = ["mysql"]

[[rules]]
id = "k1n-slack-webhook-url"
description = "Slack Incoming Webhook URL"
regex = '''https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'''
tags = ["slack", "webhook"]
keywords = ["hooks.slack.com"]

# ---------------------------------------------------------------------------
# Allowlist — False Positive Suppression
# ---------------------------------------------------------------------------
# Add patterns here that are known false positives in your codebase.
# Only add entries here after confirming they are not real secrets.

[allowlist]
description = "k1N global allowlist for known false positives"

# Suppress matches in test files where example/fake tokens are expected
paths = [
    '''^tests?/.*''',          # Test directories
    '''^test_.*\.py$''',       # Python test files
    '''.*\.test\.(js|ts)$''',  # JavaScript/TypeScript test files
    '''.*\.spec\.(js|ts)$''',  # Spec files
    '''.*_test\.go$''',        # Go test files
]

# Suppress specific regex patterns that are commonly false positives
regexes = [
    # Example/placeholder tokens in documentation
    '''your[-_]api[-_]key[-_]here''',
    '''replace[-_]with[-_]your[-_]token''',
    '''YOUR_TOKEN_HERE''',
    '''EXAMPLE_API_KEY''',
    # Test/mock values
    '''test[-_]token[-_]12345''',
    '''fake[-_]secret[-_]for[-_]testing''',
]

# Suppress specific commits (e.g., historical commits that added test fixtures)
# commits = ["aabbccdd1234567890abcdef1234567890abcdef"]
